[package]
name = "slint-layer-shell"
version = "0.1.0"
edition = "2024"

[dependencies]
slint = { version = "1.17.0", default-features = false, features = ["renderer-skia", "compat-1-2"] }
i-slint-core = { version = "1.17.0", default-features = false }
i-slint-renderer-skia = { version = "1.17.0", default-features = false }
smithay-client-toolkit = { version = "0.20.0", default-features = false, features = ["xkbcommon", "calloop"] }
libc = "0.2"
paste = "1.0"
log = "0.4"
